<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>08 - Hero Section - Sebelum</title>

    <style>
        /* CSS reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Atur body agar konten berada di tengah layar */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6; /* abu-abu terang */
        }

        /* Gaya untuk header hero section */
        header {
            height: 100vh; /* tinggi penuh layar */
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
            background-size: cover; /* agar gambar menutupi seluruh area */
            background-position: center; /* posisikan gambar di tengah */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white; /* teks berwarna putih */
            text-align: center;
        }

        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            background-color: #2965F1; /* warna biru */
            color: white; /* teks putih */
            border-radius: 8px;
            text-decoration: none; /* hilangkan garis bawah pada link */
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Pada elemen <header>, atur height: 100vh agar memenuhi tinggi layar.
    2. Tambahkan background-image pada <header>. Agar gambar tidak belang, gunakan background-size: cover dan background-position: center.
    3. Agar teks mudah dibaca di atas gambar, tambahkan overlay linear-gradient pada property background-image (misal rgba hitam ke rgba hitam transparan).
    4. Gunakan Flexbox pada <header> (display: flex, flex-direction: column, justify-content: center, align-items: center) agar konten tepat di tengah.
    5. Ubah warna teks menjadi putih dan styling tombol (padding, background, border-radius).
    -->
    <header>
        <div class="hero-content">
            <h1>Bangun Masa Depan Digital Anda</h1>
            <p>Kami membantu startup dan perusahaan bertransformasi menjadi lebih modern dengan teknologi web terbaru.</p>
            <a href="#" class="btn">Mulai Proyek</a>
        </div>
    </header>
</body>
</html>
