<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Laba Rugi</title>
    <link rel="stylesheet" href="laba_rugi.css">
</head>
<body>

    <div class="container">
        <h2>PT PRIMA AKUNTINDO</h2>
        <h3>LAPORAN LABA RUGI</h3>
        <p class="periode">Per 31 Oktober 2026</p>

        <table>
            <thead>
                <tr>
                    <th class="kode">Kode</th>
                    <th>Keterangan Akun</th>
                    <th class="nominal">Nominal (Rp)</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>4101</td>
                    <td class="keterangan">Pendapatan Jasa</td>
                    <td class="nominal">120.000.000</td>
                </tr>

                <tr>
                    <td>5101</td>
                    <td class="keterangan">Beban Gaji Karyawan</td>
                    <td class="nominal">30.000.000</td>
                </tr>

                <tr>
                    <td>5102</td>
                    <td class="keterangan">Beban Sewa Gedung</td>
                    <td class="nominal">10.000.000</td>
                </tr>

                <tr>
                    <td>5103</td>
                    <td class="keterangan">Beban Perlengkapan</td>
                    <td class="nominal">2.500.000</td>
                </tr>

                <tr class="total">
                    <td colspan="2">TOTAL LABA BERSIH</td>
                    <td class="nominal">77.500.000</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
